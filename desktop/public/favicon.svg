<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="prodoBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1b1733"/>
      <stop offset="70%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#070514"/>
    </radialGradient>

    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d72ff"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#ff72d2"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#prodoBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#neonGradient)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Concentric Focus Radar Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 16"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#9d72ff" stroke-width="8" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00f5ff" stroke-width="6"/>

  <!-- Focus Reticle Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="120" stroke="url(#neonGradient)" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="392" x2="256" y2="456" stroke="url(#neonGradient)" stroke-width="8" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="120" y2="256" stroke="url(#neonGradient)" stroke-width="8" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="456" y2="256" stroke="url(#neonGradient)" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Core Pin -->
  <circle cx="256" cy="256" r="24" fill="url(#neonGradient)"/>
  <circle cx="256" cy="256" r="10" fill="#070514"/>
</svg>